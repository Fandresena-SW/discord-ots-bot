# discord-ots-bot overlay on top of upstream's self-hosted Supabase compose
# (pinned in /opt/supabase/.supabase-version). RFC-015, edge moved out by RFC-016.
# Layered via COMPOSE_FILE in /opt/supabase/.env:
#   docker-compose.yml:ots/docker-compose.ots.yml
#
# There is deliberately NO upstream `caddy` overlay any more: the public edge is
# the shared, standalone Caddy in /opt/edge (deploy/edge/).
#
# Paths below are relative to /opt/supabase (the project directory).

services:
  # --- Services this project does not use (RFC-015 §3.2) -----------------
  # `profiles` keeps them defined but never started. Nothing remaining
  # depends on them; the gateway just 503s their routes, and Caddy blocks
  # those paths from the internet anyway.
  auth:
    profiles: ["unused"]
  realtime:
    profiles: ["unused"]
  storage:
    profiles: ["unused"]
  imgproxy:
    profiles: ["unused"]
  # Supavisor is also the only thing that would publish Postgres' port.
  supavisor:
    profiles: ["unused"]

  # --- Gateway: loopback only + the shared edge -----------------------------
  # Upstream publishes the gateway on all interfaces. bot.py needs it on loopback
  # only. Docker bypasses ufw, so this must stay bound to 127.0.0.1 — never
  # "8000:8000". The gateway and Studio also join the external `edge` network so
  # the shared Caddy can reach them (by container name — see deploy/edge).
  api-gw:
    ports: !override
      - "127.0.0.1:8000:8000"
    networks:
      default: {}
      edge: {}
  studio:
    networks:
      default: {}
      edge: {}

  # --- Edge Function secrets (set in /opt/supabase/.env, never committed) --
  functions:
    environment:
      CHALLONGE_API_KEY: ${CHALLONGE_API_KEY:-}
      CHALLONGE_SYNC_SECRET: ${CHALLONGE_SYNC_SECRET:-}

networks:
  edge:
    external: true
